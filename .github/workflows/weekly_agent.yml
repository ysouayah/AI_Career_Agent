name: Weekly AI Career Agent

on:
  schedule:
    - cron: '37 7 * * 1'
      timezone: "America/New_York"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install --with-deps chromium

    - name: Generate secrets.toml
      run: |
        echo 'GEMINI_API_KEY = "${{ secrets.GEMINI_API_KEY }}"' > secrets.toml
        echo 'EMAIL_USER = "${{ secrets.EMAIL_USER }}"' >> secrets.toml
        echo 'EMAIL_PASS = "${{ secrets.EMAIL_PASS }}"' >> secrets.toml

    - name: Run AI Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: python run_everything.py

    - name: Commit Updated Memory Bank
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        for f in memory_bank.db agent_log.csv postings.jsonl; do
          if [ -f "$f" ]; then git add -f "$f"; fi
        done
        git diff --staged --quiet || (git commit -m "Auto-update memory bank, run log, and posting archive" && git pull --rebase --autostash && git push)